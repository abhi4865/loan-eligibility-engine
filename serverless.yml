# serverless.yml : AWS resources for the Loan Eligibility Engine (S3 bucket, 2 Lambdas, IAM, optional HTTP API)
# Deploy with: npx serverless deploy   (see instruction7.md)
service: loan-eligibility-engine
frameworkVersion: '3'
useDotenv: true          # reads values from .env (or .env.<stage>) when you run serverless

provider:
  name: aws
  runtime: python3.11
  region: ${env:AWS_REGION, 'ap-south-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 10
  # Public HTTP API for the presign Lambda. CORS lets the browser page call it.
  httpApi:
    cors:
      allowedOrigins: ['*']          # tighten to your page origin before real use
      allowedMethods: [GET, OPTIONS]
      allowedHeaders: [Content-Type]
  # One shared role for both Lambdas. Least privilege: only this bucket, only the uploads/ prefix.
  iam:
    role:
      statements:
        - Effect: Allow
          Action: [s3:GetObject, s3:PutObject]
          Resource: arn:aws:s3:::${env:S3_BUCKET}/uploads/*
        # Not used by the two Lambdas. n8n sends mail with its own AWS credential. Kept because the spec lists it.
        - Effect: Allow
          Action: [ses:SendEmail, ses:SendRawEmail]
          Resource: arn:aws:ses:${self:provider.region}:*:identity/*
  # Same names as the local .env. AWS_* and S3_ENDPOINT_URL are not needed: Lambda provides credentials and region.
  # Secrets here end up in the Lambda configuration. For stricter setups use: ${ssm:/loan-engine/postgres-password}
  environment:
    POSTGRES_HOST: ${env:POSTGRES_HOST}
    POSTGRES_PORT: ${env:POSTGRES_PORT, '5432'}
    POSTGRES_DB: ${env:POSTGRES_DB}
    POSTGRES_USER: ${env:POSTGRES_USER}
    POSTGRES_PASSWORD: ${env:POSTGRES_PASSWORD}
    S3_BUCKET: ${env:S3_BUCKET}
    S3_ENDPOINT_URL: ''
    N8N_WEBHOOK_URL: ${env:N8N_WEBHOOK_URL}
    N8N_WEBHOOK_SECRET: ${env:N8N_WEBHOOK_SECRET}
  # Optional: put the Lambdas inside your VPC (private RDS). Needs NAT for internet. Default: off (RDS must be reachable).
  vpc: ${self:custom.vpc.${env:USE_VPC, 'off'}}

custom:
  # Check the function names with: grep -n "^def " lambdas/presign/handler.py lambdas/parser/handler.py
  presignHandler: lambdas/presign/handler.handler
  parserHandler: lambdas/parser/handler.handler
  vpc:
    off:
      securityGroupIds: []
      subnetIds: []
    on:
      securityGroupIds: ['${env:VPC_SECURITY_GROUP_ID, ""}']
      subnetIds: ['${env:VPC_SUBNET_ID_1, ""}', '${env:VPC_SUBNET_ID_2, ""}']
  pythonRequirements:
    fileName: requirements-lambda.txt            # only what Lambda needs (boto3 is already in the runtime)
    # Resolve Linux wheels directly so Windows packaging does not need a separate Docker build image.
    dockerizePip: false
    pipCmdExtraArgs:
      - '--platform manylinux2014_x86_64'
      - '--only-binary=:all:'
      - '--implementation cp'
      - '--python-version 3.11'
      - '--abi cp311'
    slim: true
    pythonBin: ${env:PYTHON_BIN, 'python'}         # Linux/Mac without a 'python' command: set PYTHON_BIN=python3

plugins:
  - serverless-python-requirements

package:
  patterns:
    - '!**'
    - 'lambdas/**'
    - '!.pytest_cache/**'
    - '!.venv/**'
    - '!__pycache__/**'
    - '!tests/**'
    - '!node_modules/**'
    - '!.git/**'
    - '!lambdas/**/__pycache__/**'
    - '!lambdas/**/*.pyc'

functions:
  presign:
    handler: ${self:custom.presignHandler}
    description: Creates a batch row and a presigned S3 PUT URL
    events:
      - httpApi:
          path: /presign
          method: get
  parser:
    handler: ${self:custom.parserHandler}
    description: Reads the uploaded CSV from S3, saves users in Postgres, calls n8n
    timeout: 300
    memorySize: 512

resources:
  Resources:
    # Lets S3 start the parser Lambda. Must exist before the bucket sends events.
    ParserS3Permission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt ParserLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: s3.amazonaws.com
        SourceAccount: !Ref AWS::AccountId
        SourceArn: arn:aws:s3:::${env:S3_BUCKET}
    UploadBucket:
      Type: AWS::S3::Bucket
      DependsOn: ParserS3Permission
      Properties:
        BucketName: ${env:S3_BUCKET}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        # The browser PUTs the CSV here, so it needs CORS (same rule as scripts/set_bucket_cors.py).
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins: ['*']
              AllowedMethods: [PUT, GET, HEAD]
              AllowedHeaders: ['*']
              ExposedHeaders: [ETag]
              MaxAge: 3000
        # Every new object under uploads/ starts the parser.
        NotificationConfiguration:
          LambdaConfigurations:
            - Event: s3:ObjectCreated:*
              Function: !GetAtt ParserLambdaFunction.Arn
              Filter:
                S3Key:
                  Rules:
                    - Name: prefix
                      Value: uploads/
        LifecycleConfiguration:
          Rules:
            - Id: expire-demo-uploads
              Status: Enabled
              Prefix: uploads/
              ExpirationInDays: 30
  Outputs:
    PresignUrl:
      Description: Put this base URL in the UI Settings (API URL)
      Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
    UploadBucketName:
      Value: !Ref UploadBucket
